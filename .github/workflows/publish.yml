name: "publish"
on:
  push:
    branches:
      - main
      - beta
permissions:
    contents: write
    id-token: write
    pull-requests: write
    issues: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: 'yarn'
      - run: yarn install
      - run: yarn typecheck
      - run: yarn test:ci
      - run: yarn build
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - uses: codecov/codecov-action@v6.0.0
        with:
          files: coverage/lcov.info
